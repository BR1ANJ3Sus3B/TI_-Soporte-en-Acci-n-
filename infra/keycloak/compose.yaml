services:
  keycloak:
    image: quay.io/keycloak/keycloak:26.4
    container_name: ti-soporte-keycloak
    command: start-dev --import-realm
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KC_ADMIN_PASSWORD:?Define KC_ADMIN_PASSWORD en .env}
      KC_HEALTH_ENABLED: "true"
      KC_METRICS_ENABLED: "true"
    ports:
      - "8080:8080"
    volumes:
      - keycloak_data:/opt/keycloak/data
      - ./themes/novatech:/opt/keycloak/themes/novatech:ro
      - ./realm-import:/opt/keycloak/data/import:ro
    expose:
      - "9000"
    restart: unless-stopped
    networks:
      - default
      - monitoring

volumes:
  keycloak_data:

networks:
  monitoring:
    external: true
    name: ti-soporte-monitoring_default
