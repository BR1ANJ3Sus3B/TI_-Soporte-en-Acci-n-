name: ti-soporte-api

services:
  mongo:
    image: mongo:8.0
    restart: unless-stopped
    command: ["mongod", "--bind_ip_all"]
    volumes:
      - api-mongo-data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 15s
    networks: [database]

  mongodb-exporter:
    image: percona/mongodb_exporter:0.54.0
    restart: unless-stopped
    command: ["--mongodb.uri=mongodb://mongo:27017"]
    depends_on:
      mongo:
        condition: service_healthy
    expose: ["9216"]
    networks: [database, monitoring]

  api:
    build:
      context: ../../api
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file:
      - path: .env
        required: false
    environment:
      NODE_ENV: production
      PORT: "3000"
      MONGODB_URI: ${MONGODB_URI:-mongodb://mongo:27017/ti_soporte_en_accion}
      KEYCLOAK_ISSUER: ${KEYCLOAK_ISSUER:-http://localhost:8080/realms/ti-soporte}
      KEYCLOAK_AUDIENCE: ${KEYCLOAK_AUDIENCE:-ti-soporte-api}
      KEYCLOAK_JWKS_URI: ${KEYCLOAK_JWKS_URI:-http://keycloak:8080/realms/ti-soporte/protocol/openid-connect/certs}
      KEYCLOAK_CLIENT_ID: ${KEYCLOAK_CLIENT_ID:-ti-soporte-flutter}
      METRICS_BEARER_TOKEN: ${METRICS_BEARER_TOKEN:?Define METRICS_BEARER_TOKEN en .env}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:5173,http://localhost:4173}
      API_BIND_ADDRESS: ${API_BIND_ADDRESS:-127.0.0.1}
      API_PORT: ${API_PORT:-3000}
    ports:
      - "${API_BIND_ADDRESS:-127.0.0.1}:${API_PORT:-3000}:3000"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      mongo:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/health/ready').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 20s
    networks: [default, database, keycloak, monitoring]

volumes:
  api-mongo-data:

networks:
  database:
    internal: true
  keycloak:
    external: true
    name: keycloak_default
  monitoring:
    external: true
    name: ti-soporte-monitoring_default
