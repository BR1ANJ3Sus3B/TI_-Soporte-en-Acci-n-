groups:
  - name: ti-soporte-service-alerts
    rules:
      - alert: TiSoporteApiDown
        expr: up{job="ti-soporte-api"} == 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "La API TI: Soporte en Acción no responde"
      - alert: TiSoporteMongoExporterDown
        expr: up{job="ti-soporte-mongodb"} == 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "El exporter de MongoDB no responde"
      - alert: TiSoporteKeycloakMetricsDown
        expr: up{job="ti-soporte-keycloak"} == 0
        for: 1m
        labels:
          severity: warning
        annotations:
          summary: "Keycloak metrics no responde"
